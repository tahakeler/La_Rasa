name: Unity Tests

# Blocking CI gate per .claude/docs/coding-standards.md:
# "Automated test suite runs on every push to main and every PR.
#  No merge if tests fail."
#
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE  - contents of a Unity .ulf license file (activate once locally)
#   UNITY_EMAIL    - Unity account email
#   UNITY_PASSWORD - Unity account password
# Until those exist this workflow will fail at the activation step — that is
# expected; wire the secrets as part of S1-003.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode + PlayMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results

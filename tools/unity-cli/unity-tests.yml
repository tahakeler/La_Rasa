name: Unity Tests

# NOT ACTIVE. This is a template, kept here on purpose.
#
# To turn on Unity CI: copy this file to `.github/workflows/unity-tests.yml`
# and add these repo secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE  - contents of a Unity .ulf license file (see README.md, §3)
#   UNITY_EMAIL    - Unity account email
#   UNITY_PASSWORD - Unity account password
#
# It was removed from .github/workflows/ because without the secrets — and
# without an Editor-verified project — every run fails red. Run the EditMode
# suite locally in Unity's Test Runner until you're ready to wire this up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: EditMode + PlayMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results
